<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc9ff; }
  body {
    font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', sans-serif; color: #1c2733;
    touch-action: manipulation; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    position: fixed; inset: 0;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #c { touch-action: none; }
  #fx { pointer-events: none; }
  rt { font-size: 0.5em; font-weight: 400; }

  .rbtn {
    font: inherit; font-weight: 700; font-size: 20px; min-width: 52px; min-height: 52px; padding: 0 14px;
    border: 3px solid #1c2733; border-radius: 16px; background: #fff; color: #1c2733;
    touch-action: manipulation; cursor: pointer;
  }
  .rbtn:active { background: #dfe8f0; }

  #hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  #hud > * { position: absolute; }
  #homeBtn { left: 10px; top: 10px; pointer-events: auto; }
  #helpBtn { right: 10px; top: 10px; pointer-events: auto; font-size: 26px; }
  #info {
    left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
    background: rgba(255,255,255,.92); border: 3px solid #1c2733; border-radius: 16px; padding: 6px 16px;
    font-weight: 700; font-size: 22px; white-space: nowrap;
  }
  #starTxt.pop { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.5); } }
  #prog { left: 50%; top: 70px; transform: translateX(-50%); width: min(60vw, 420px); height: 14px; background: rgba(255,255,255,.85); border: 3px solid #1c2733; border-radius: 9px; overflow: hidden; }
  #progFill { height: 100%; width: 0; background: #1c2733; }
  #nav { left: 50%; top: 66px; transform: translateX(-50%); display: none; align-items: center; gap: 8px;
    background: rgba(255,255,255,.92); border: 3px solid #1c2733; border-radius: 16px; padding: 4px 14px; font-weight: 700; font-size: 18px; white-space: nowrap; }
  #navArrow { width: 34px; height: 34px; }
  #hint {
    left: 50%; bottom: 22%; transform: translateX(-50%); font-weight: 700; font-size: 30px; color: #fff;

    animation: pulse .7s infinite alternate;

  @keyframes pulse { to { transform: translateX(-50%) scale(1.12); } }
  #callout {
    left: 50%; top: 14%; transform: translateX(-50%); font-weight: 700; font-size: clamp(30px, 6vw, 52px); color: #1c2733;
    background: #fff; border: 4px solid #1c2733; border-radius: 28px; padding: 6px 30px; display: none; white-space: nowrap;
  }
  #callout.pop { animation: cpop .4s; }
  @keyframes cpop { 0% { transform: translateX(-50%) scale(.4); } 70% { transform: translateX(-50%) scale(1.12); } 100% { transform: translateX(-50%) scale(1); } }
  #ver { right: 8px; bottom: 6px; font-size: 11px; color: rgba(255,255,255,.9); text-shadow: 0 0 3px #000; }

  #pad { position: absolute; inset: 0; pointer-events: none; display: none; }
  #pad button {
    position: absolute; pointer-events: auto; touch-action: none; font: inherit; font-weight: 700; color: #1c2733;
    border: 4px solid #1c2733; background: rgba(255,255,255,.88); cursor: pointer;
  }
  #pad button.on { background: #ffd23c; }
  #pad button svg { pointer-events: none; display: block; margin: auto; }
  #steerL, #steerR { bottom: 22px; width: 92px; height: 92px; border-radius: 24px; font-size: 40px; }
  #steerL { left: 18px; } #steerR { left: 124px; }
  #webBtn { right: 22px; bottom: 22px; width: 124px; height: 124px; border-radius: 50%; font-size: 26px; line-height: 1.15; }

  .ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,40,70,.55); padding: 12px; }
  .ov.show { display: flex; }
  .card {
    background: #fff; border: 4px solid #1c2733; border-radius: 26px; padding: 18px 22px; width: min(680px, 100%);
    max-height: 100%; overflow-y: auto; text-align: center; -webkit-overflow-scrolling: touch;
  }
  .card h1 { margin: 2px 0 10px; font-size: clamp(28px, 6vw, 44px); line-height: 1.5; }
  .card h2 { margin: 2px 0 10px; font-size: clamp(22px, 4.4vw, 30px); line-height: 1.6; }
  .lead { font-size: 18px; margin: 0 0 12px; line-height: 1.9; }
  .lvbtn {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; margin: 10px 0; padding: 8px 16px;
    font: inherit; text-align: left; border: 3px solid #1c2733; border-radius: 18px; background: #fff7d6; color: #1c2733; cursor: pointer;
    touch-action: manipulation;
  }
  .lvbtn:active { background: #ffe58a; }
  .lvnum { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #1c2733; color: #fff; font-weight: 700; font-size: 26px; display: flex; align-items: center; justify-content: center; }

<script>
// ===== ゲームのコア（描画に依存しない計算部分）=====
(function (root) {
  'use strict';

  // ---- 調整値（ここの数値を変えると手ごたえが変わります）----
  const CFG = {
    gravity: 24,          // 重力
    playerR: 0.9,         // キャラの当たり半径
    reelSpeed: 15,        // 糸をたぐりよせる速さ
    ropeClear: 4.5,       // たぐりきったとき、振り子のいちばん下が地面から何mか
    minRope: 6,           // 糸のいちばん短い長さ
    swingBoost: 8,        // スイング中に前へ押す力（チート）
    releaseF: 3,          // 離したときの前へのひと押し
    releaseU: 5,          // 離したときの上へのひと押し
    minReleaseSpeed: 10,  // 離したあとの前向き速度の下限
    maxSpeed: 36,         // 最高速度
    autoReleaseDeg: 58,   // 押しっぱなしでも、この角度まで振れたら自動で糸が切れる
    hop: 6.5,             // 地面ではねる強さ
    hopForward: 5,        // 押しているのにボールが遠いとき、ぴょんと前へ進む速さ（行きづまり防止）
    groundFriction: 0.4,  // 地面ではねるたびに残る前向き速度の割合
    wallBounce: 0.5,      // ビルの壁ではね返る割合
    steerRate: 2.0,       // レベル3の曲がる速さ（rad/秒）
    ballR: 5.2,           // 一本道の「光の玉」の大きさ（この中に入れば取れる）
    pillarR: 5.5,         // 街の「光の柱」の太さ（柱のどの高さでも取れる）
    skyPillarR: 7,        // 空の「光の柱」の太さ
    levels: [
      { id: 1, mode: 'straight', n: 14, gapMin: 22, gapMax: 22, hMin: 17, hMax: 17, rangeH: 30, seed: 11 },
      { id: 2, mode: 'straight', n: 26, gapMin: 20, gapMax: 30, hMin: 15, hMax: 24, rangeH: 34, seed: 23 },
      { id: 3, mode: 'free', world: 'city', rangeH: 34, stars: 6, seed: 37 },
      { id: 4, mode: 'free', world: 'sky', rangeH: 42, stars: 7, seed: 53, maxSpeed: 42, bound: 150 }
    ]
  };

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function wrapAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  // ---- レベルを作る ----
  function makeLevel(index) {
    const lv = CFG.levels[index];
    const R = rng(lv.seed);
    const S = {
      lv: lv, levelIndex: index, mode: lv.mode, world: lv.world || 'road',
      p: { x: 0, y: CFG.playerR, z: 0 }, v: { x: 0, y: 0, z: 0 },
      heading: 0, rope: null, spent: false, prevHeld: false,
      input: { held: false, steer: 0 },
      anchors: [], buildings: [], stars: [], starsGot: 0,
      goalZ: 0, bound: 0, t: 0, finished: false, events: [],
      airTime: 0
    };
    if (lv.mode === 'straight') {
      let z = 16;
      for (let i = 0; i < lv.n; i++) {
        const y = lv.hMin + (lv.hMax - lv.hMin) * R();
        S.anchors.push({ x: 0, y: y, z: z, id: i });
        z += lv.gapMin + (lv.gapMax - lv.gapMin) * R();
      }
      // ゴールは最後から3つ目のボールの先。ゴールの向こうにもボールがあるので行きづまらない
      S.goalZ = S.anchors[lv.n - 3].z + 12;
      // 星（光の玉）：ふつうに遊んだときに通る道すじの上に置く
      // → 「押す→切れたら離す」をくり返すお手本を先に走らせ、その高さを使う
      const path = ghostPath(S);
      const yAt = function (z) {
        for (let k = 1; k < path.length; k++) if (path[k][0] >= z) return path[k][1];
        return 8;
      };
      for (let i = 0; i < S.anchors.length - 1; i++) {
        const a = S.anchors[i], b = S.anchors[i + 1];
        const z = i % 2 === 0 ? a.z + 2 : (a.z + b.z) / 2;
        if (z > S.goalZ - 8) break;
        S.stars.push({ kind: 'ball', r: CFG.ballR, x: 0, y: Math.max(3, yAt(z)), z: z, got: false });
      }
    } else if (S.world === 'sky') {
      // 空：建物はなし。ボールが空のあちこちに浮かんでいる
      const B = lv.bound, sp = 24;
      let id = 0;
      for (let x = -B + 10; x <= B - 10; x += sp) for (let z = -B + 10; z <= B - 10; z += sp) {
        S.anchors.push({ x: x + (R() - 0.5) * 12, y: 20 + R() * 38, z: z + (R() - 0.5) * 12, id: id++ });
      }
      S.bound = B;
      let tries = 0;
      while (S.stars.length < lv.stars && tries++ < 2000) {
        const x = (R() * 2 - 1) * (B - 30), z = (R() * 2 - 1) * (B - 30);
        if (Math.hypot(x, z) < 35) continue;
        let ok = true;
        for (const q of S.stars) if (Math.hypot(q.x - x, q.z - z) < 55) ok = false;
        if (ok) S.stars.push({ kind: 'pillar', r: CFG.skyPillarR, top: 200, x: x, y: 4, z: z, got: false });
      }
      S.p.x = 0; S.p.z = -10;
    } else {
      // 5×5のビル街。道はビルの間（x,z = ±20, ±60）と外周（±100）
      const pitch = 40, half = 13;
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
        const h = 10 + Math.floor(R() * 12) * 2;
        S.buildings.push({ x0: i * pitch - half, x1: i * pitch + half, z0: j * pitch - half, z1: j * pitch + half, h: h });
      }
      const lines = [-100, -60, -20, 20, 60, 100];
      let id = 0;
      const seen = {};
      const add = function (x, z) {
        const k = x + ',' + z; if (seen[k]) return; seen[k] = 1;
        S.anchors.push({ x: x, y: 19 + R() * 4, z: z, id: id++ });
      };
      for (const c of lines) for (let u = -100; u <= 100; u += 20) { add(c, u); add(u, c); }
      S.bound = 106;
      // 星：道の上（ボールとボールの間）に、はなして置く
      const spots = [];
      for (const c of lines) for (let u = -90; u <= 90; u += 20) { spots.push([c, u]); spots.push([u, c]); }

    }

    if (S.mode === 'straight') { p.x = 0; v.x = 0; }
    else {
      // ビル（空モードは buildings が空）

            if (m === l) { p.x = b.x0 - R; v.x = -Math.abs(v.x) * C.wallBounce - 1; }
            else if (m === rr) { p.x = b.x1 + R; v.x = Math.abs(v.x) * C.wallBounce + 1; }
            else if (m === n) { p.z = b.z0 - R; v.z = -Math.abs(v.z) * C.wallBounce - 1; }
            else { p.z = b.z1 + R; v.z = Math.abs(v.z) * C.wallBounce + 1; }

      if (p.x < -B) { p.x = -B; v.x = Math.abs(v.x) * C.wallBounce + 2; }
      if (p.z > B) { p.z = B; v.z = -Math.abs(v.z) * C.wallBounce - 2; }
      if (p.z < -B) { p.z = -B; v.z = Math.abs(v.z) * C.wallBounce + 2; }
    }

// ================= 進行 =================
function readInput() {
  S.input.held = webPointers.size > 0 || !!keys[' '] || apiInput.held;
  let st = apiInput.steer;
  for (const d of steerPointers.values()) st += d;
  if (keys['ArrowLeft']) st -= 1; if (keys['ArrowRight']) st += 1;
  S.input.steer = Math.max(-1, Math.min(1, st));
}

function callout(text, sec) {
  const el = $('callout'); el.textContent = text; el.style.display = 'block';
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  clearTimeout(callout._t); callout._t = setTimeout(() => { el.style.display = 'none'; }, sec * 1000);
}
function setPhase(p) {
  phase = p; phaseT = 0;
  if (p === 'play') { callout('スタート！', 0.9); }
  if (p === 'celebrate') {
    S.v.x = S.v.y = S.v.z = 0; setFace('happy'); callout('やったー！', 2.2); spawnConfetti(); sfx.hop();
  }
}

function advance(dt) {
  if (!S) return;
  phaseT += dt;
  if (phase === 'intro') {
    if (phaseT > 0.25 && phaseT - dt <= 0.25) { sfx.hello(); callout('いくよ！', 1.6); }
    if (phaseT >= VIEW.introLen) setPhase('play');
    return;
  }
  if (phase === 'celebrate') {
    // 地面（屋上）の高さへ落ちつく
    const gy = groundYAt(S.p.x, S.p.z, S.p.y) + CFG.playerR;
    S.p.y += (gy - S.p.y) * Math.min(1, dt * 6);
    updateConfetti(dt);
    if (phaseT >= VIEW.celebrateLen && !resultShown) { resultShown = true; showResult(); }
    return;
  }
  if (phase === 'coast') { S.input.held = false; S.input.steer = 0; }
  else readInput();
  const n = Math.max(1, Math.ceil(dt / (1 / 120)));
  for (let i = 0; i < n; i++) {
    step(S, dt / n);
    if (phase === 'coast') { S.input.held = false; S.input.steer = 0; }
  }
  if (!S.finished) G.elapsed = S.t;
  for (const e of S.events) {
    if (e.type === 'land' && phase === 'coast') landedInCoast = true;
    if (e.type === 'attach') { sfx.attach(); threadGrow = 0; }
    else if (e.type === 'release') sfx.release();
    else if (e.type === 'miss') { sfx.miss(); missT = 0.16; }
    else if (e.type === 'star') { sfx.star(); const el = $('starTxt'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    else if (e.type === 'bounce') sfx.bounce();
    else if (e.type === 'bump') sfx.bump();
    else if (e.type === 'goal') { sfx.goal(); setPhase('coast'); }
  }
  S.events.length = 0;
  if (phase === 'coast' && ((landedInCoast && phaseT > VIEW.coastMin) || phaseT > VIEW.coastMax)) setPhase('celebrate');
  threadGrow = Math.min(1, threadGrow + dt / 0.09);
  if (missT > 0) missT -= dt;
}

const confGeo = new THREE.PlaneGeometry(0.28, 0.42);
const confCols = [0xff4f9a, 0xffd23c, 0x3fb5ff, 0x5ad16b, 0xff8a3c, 0xffffff].map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
function spawnConfetti() {
  confetti = new THREE.Group(); world.add(confetti);
  for (let i = 0; i < 80; i++) {
    const m = new THREE.Mesh(confGeo, confCols[i % confCols.length]);
    m.position.set(S.p.x, S.p.y + 2.2, S.p.z);
    const an = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 6;
    m.userData.v = new THREE.Vector3(Math.cos(an) * sp, 7 + Math.random() * 7, Math.sin(an) * sp);
    m.userData.w = new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10);
    confetti.add(m);
  }
}
function updateConfetti(dt) {
  if (!confetti) return;
  for (const m of confetti.children) {
    const v = m.userData.v;
    v.y -= 9 * dt; v.multiplyScalar(1 - 1.2 * dt);
    m.position.addScaledVector(v, dt);
    m.rotation.x += m.userData.w.x * dt; m.rotation.y += m.userData.w.y * dt; m.rotation.z += m.userData.w.z * dt;
  }
}

const _v = new THREE.Vector3(), _d = new THREE.Vector3(), _q = new THREE.Quaternion(), _hand = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);

function groundYAt(x, z, y) {
  let gy = 0;
  if (S.mode === 'free') for (const b of S.buildings) if (x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1 && y > b.h - 0.5) gy = Math.max(gy, b.h);
  return gy;
}
function insideBuilding(x, y, z, m) {
  for (const b of S.buildings) if (x > b.x0 - m && x < b.x1 + m && z > b.z0 - m && z < b.z1 + m && y < b.h + m) return true;
  return false;
}

function updateVisuals(dt, snap) {
  if (!S) return;
  const p = S.p, v = S.v;
  const hs = Math.hypot(v.x, v.z), spd = Math.hypot(v.x, v.y, v.z);
  const tt = performance.now() / 1000;
  const showFace = screen === 'title' || screen === 'howto' && phase === 'intro' || phase === 'intro' || phase === 'celebrate' || screen === 'result';

  // キャラ（よろこぶ間はぴょんぴょん）
  let jump = 0;
  if (phase === 'celebrate' || screen === 'result') jump = Math.abs(Math.sin(phaseT * 6.5)) * 1.1;
  player.position.set(p.x, p.y + jump, p.z);
  player.rotation.y = S.mode === 'free' ? S.heading : 0;
  const pitch = (phase === 'play' || phase === 'coast') ? -Math.atan2(v.y, Math.max(hs, 4)) * 0.6 : 0;
  player.rotation.x += (pitch - player.rotation.x) * Math.min(1, dt * 10 + (snap ? 1 : 0));
  player.updateMatrixWorld(true);

  // 糸と右うで
  const armR = player.userData.armR;
  armR.getWorldPosition(_hand);
  let aim = null;
  if (S.rope) { aim = _v.set(S.rope.a.x, S.rope.a.y, S.rope.a.z); }
  else if (missT > 0) { const f = S.mode === 'free' ? S.heading : 0; aim = _v.set(p.x + Math.sin(f) * 7, p.y + 7, p.z + Math.cos(f) * 7); }
  if (aim) {
    _d.copy(aim).sub(_hand); const len = _d.length(); _d.normalize();
    thread.visible = true; thread.position.copy(_hand); thread.quaternion.setFromUnitVectors(UP, _d);
    thread.scale.set(1, Math.max(0.01, len * (S.rope ? threadGrow : (1 - missT / 0.16))), 1);
    _q.copy(player.quaternion).invert(); _d.applyQuaternion(_q);
    armR.quaternion.setFromUnitVectors(UP, _d);
  } else {
    thread.visible = false;
    if (phase === 'celebrate' || screen === 'result') {
      // 両手をあげて ばんざい
      const w = Math.sin(tt * 12) * 0.25;
      armR.quaternion.setFromUnitVectors(UP, _d.set(-0.55 - w, 0.83, 0.1).normalize());
      player.userData.armL.quaternion.setFromUnitVectors(UP, _d.set(0.55 + w, 0.83, 0.1).normalize());
    } else if (phase === 'intro') {
      // 手をふって あいさつ
      const w = Math.sin(tt * 9) * 0.35;
      armR.quaternion.setFromUnitVectors(UP, _d.set(-0.45 + w, 0.88, 0.25).normalize());
      player.userData.armL.quaternion.setFromUnitVectors(UP, _d.set(0.35, -0.94, 0).normalize());
    } else {
      armR.quaternion.setFromUnitVectors(UP, _d.set(-0.35, -0.94, 0).normalize());
      player.userData.armL.quaternion.setFromUnitVectors(UP, _d.set(0.35, -0.94, 0).normalize());
    }
  }

  // かげ
  const gy = groundYAt(p.x, p.z, p.y);
  const hgt = Math.max(0, p.y + jump - gy);
  shadow.position.set(p.x, gy + 0.06, p.z);
  const ss = 0.9 + Math.min(hgt, 30) * 0.03; shadow.scale.set(ss, ss, 1);
  shadow.material.opacity = Math.max(0.12, 0.4 - hgt * 0.01);

  // ボール：いま押したらくっつく相手を強調
  target = phase !== 'play' ? null : (!S.rope ? pickAnchor(S) : S.rope.a);
  for (const g of anchorMeshes) {
    const on = g.userData.a === target;
    g.userData.orb.material = on ? orbMatOn : orbMat;
    const sc = on ? 1.45 + Math.sin(tt * 10) * 0.2 : 1;
    g.scale.setScalar(sc);
    g.userData.ring.rotation.y = tt * (on ? 4 : 1.2);
  }
  for (const g of starMeshes) {
    const u = g.userData, s = u.s;
    u.star.rotation.y = tt * 2.2;
    if (u.starBaseY) u.star.position.y = u.starBaseY + Math.sin(tt * 2 + s.x) * 1.2;
    if (s.got) {
      // 取ったら ふくらんで 消える
      u.fade = Math.min(1, u.fade + dt / 0.45);
      g.visible = u.fade < 1;
      g.scale.setScalar(1 + u.fade * 0.6);
      for (const m of u.mats) m.opacity = m.userData.base * (1 - u.fade);
    } else if (s.kind === 'ball') g.scale.setScalar(1 + Math.sin(tt * 4 + s.z) * 0.05);
  }

  // カメラ：ふだんは後ろから。顔を見せるときは前へ回りこむ
  const wantYaw = S.mode === 'free' ? S.heading : 0;
  camYaw = wrapAngle(camYaw + wrapAngle(wantYaw - camYaw) * Math.min(1, VIEW.camYawRate * dt));
  const front = showFace;
  const k = snap ? 1 : 1 - Math.exp(-VIEW.orbitRate * dt);
  camOrbit += ((front ? Math.PI : 0) - camOrbit) * k;
  camDist += ((front ? VIEW.faceDist : VIEW.camBack) - camDist) * k;
  camUpNow += ((front ? VIEW.faceUp : VIEW.camUp) - camUpNow) * k;
  lookBlend += ((front ? 1 : 0) - lookBlend) * k;
  const yaw = camYaw + camOrbit;
  const fxn = Math.sin(camYaw), fzn = Math.cos(camYaw);
  let cx = p.x - Math.sin(yaw) * camDist, cy = Math.max(2.2, p.y + camUpNow), cz = p.z - Math.cos(yaw) * camDist;
  if (S.mode === 'free') {
    // カメラがビルにめりこむときは、キャラに近づける
    let k = 1;
    while (k > 0.25 && insideBuilding(p.x + (cx - p.x) * k, cy, p.z + (cz - p.z) * k, 0.8)) k -= 0.125;
    cx = p.x + (cx - p.x) * k; cz = p.z + (cz - p.z) * k;
  }
  const a = snap ? 1 : 1 - Math.exp(-10 * dt);
  camera.position.x += (cx - camera.position.x) * a;
  camera.position.y += (cy - camera.position.y) * a;
  camera.position.z += (cz - camera.position.z) * a;
  // 顔を見せるときの視線の高さ（よろこぶ間は「やったー！」と重ならないようキャラを少し下に）
  const wantOff = screen === 'result' ? 0.1 : phase === 'celebrate' ? 1.9 : 0.8;
  lookOff += (wantOff - lookOff) * (snap ? 1 : 1 - Math.exp(-3 * dt));
  const lb = lookBlend;
  camera.lookAt(
    p.x + fxn * VIEW.lookAhead * (1 - lb),
    p.y + VIEW.lookUp * (1 - lb) + lookOff * lb + jump * 0.5 * lb,
    p.z + fzn * VIEW.lookAhead * (1 - lb));
  const wantFov = front ? 50 : Math.min(VIEW.fovMax, VIEW.fovBase + spd * VIEW.fovPerSpeed);
  fov += (wantFov - fov) * Math.min(1, dt * 4 + (snap ? 1 : 0));
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }

  // 風の音
  if (windGain && AC) {
    const act = running && !paused && (phase === 'play' || phase === 'coast');
    const g = act ? Math.max(0, Math.min(1, (spd - 8) / 26)) * VIEW.windMax : 0;
    windGain.gain.setTargetAtTime(g, AC.currentTime, 0.08);
    windFilter.frequency.setTargetAtTime(350 + spd * 45, AC.currentTime, 0.1);
  }

  // スピード線
  fxc.clearRect(0, 0, fx.width, fx.height);
  if (running && !paused && (phase === 'play' || phase === 'coast') && spd > VIEW.speedLineFrom) {
    const w = fx.width, h = fx.height, k = Math.min(1, (spd - VIEW.speedLineFrom) / 16);
    fxc.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.4 * k) + ')'; fxc.lineWidth = Math.max(2, w / 500); fxc.lineCap = 'round';
    const R = Math.hypot(w, h) / 2;
    fxc.beginPath();
    for (let i = 0; i < 16; i++) {
      const an = Math.random() * Math.PI * 2, r0 = R * (0.55 + Math.random() * 0.3), r1 = r0 + R * (0.08 + 0.2 * k);
      fxc.moveTo(w / 2 + Math.cos(an) * r0, h / 2 + Math.sin(an) * r0); fxc.lineTo(w / 2 + Math.cos(an) * r1, h / 2 + Math.sin(an) * r1);
    }
    fxc.stroke();
  }
  updateHud();
}

let hudStar = '', hudTime = '';
function updateHud() {
  if (!S) return;
  const st = '★ ' + S.starsGot + '/' + S.stars.length;
  if (st !== hudStar) { hudStar = st; $('starTxt').textContent = st; }
  const tm = G.elapsed.toFixed(1) + ' びょう';
  if (tm !== hudTime) { hudTime = tm; $('timeTxt').textContent = tm; }
  if (S.mode === 'straight') {
    $('progFill').style.width = Math.max(0, Math.min(100, S.p.z / S.goalZ * 100)).toFixed(1) + '%';
  } else {
    let best = null, bd = 1e9;
    for (const s of S.stars) if (!s.got) { const d = Math.hypot(s.x - S.p.x, s.z - S.p.z); if (d < bd) { bd = d; best = s; } }
    if (best) {
      const rel = wrapAngle(Math.atan2(best.x - S.p.x, best.z - S.p.z) - camYaw);
      $('navArrow').style.transform = 'rotate(' + (-rel) + 'rad)';
      $('navTxt').textContent = 'ほしまで ' + Math.round(bd) + 'm';
    } else $('navTxt').textContent = '';
  }
  const ending = phase === 'celebrate' || screen === 'result';
  if (S.mode === 'free') {
    $('pad').style.display = ending ? 'none' : 'block';
    $('nav').style.display = ending ? 'none' : 'flex';
  }
  const showHint = S.levelIndex === 0 && running && !paused && phase === 'play' && phaseT > 1 && !S.rope && !S.input.held && !!target;
  $('hint').style.display = showHint ? 'block' : 'none';
  $('webBtn').classList.toggle('on', S.input.held);
}

// ================= 画面の切りかえ =================
function show(id, on) { $(id).classList.toggle('show', on); }
function releaseAllInput() { webPointers.clear(); steerPointers.clear(); $('steerL').classList.remove('on'); $('steerR').classList.remove('on'); }

function selectLevel(i) {
  buildWorld(i);
  running = false; paused = false; screen = 'howto';
  show('title', false); show('result', false);
  $('hud').style.display = 'block';
  $('startBtn').textContent = 'はじめる';
  show('howto', true);
}
function startPlay() {
  initAudio(); releaseAllInput();
  show('howto', false);
  const resume = screen === 'play';
  screen = 'play'; running = true; paused = false;
  if (!resume) { phase = 'intro'; phaseT = 0; }
}
function openHelp() {
  if (screen !== 'play' || phase === 'celebrate') return;
  paused = true; releaseAllInput();
  $('startBtn').textContent = 'つづける';
  show('howto', true);
}
function goTitle() {
  running = false; paused = false; screen = 'title'; releaseAllInput();
  show('howto', false); show('result', false); show('title', true);
  $('hud').style.display = 'none'; $('pad').style.display = 'none';
}
function showResult() {
  if (!S || !S.finished || screen !== 'play') return;
  screen = 'result'; releaseAllInput();
  $('resTitle').textContent = S.mode === 'free' ? 'ぜんぶ あつめた！' : 'ゴール！';
  $('resTime').textContent = 'タイム ' + G.elapsed.toFixed(1) + ' びょう';
  $('resStars').textContent = '★ ' + S.starsGot + ' / ' + S.stars.length + ' こ';
  show('result', true);
}

document.querySelectorAll('.lvbtn').forEach(b => b.addEventListener('click', () => { initAudio(); selectLevel(+b.dataset.lv); }));
$('startBtn').addEventListener('click', startPlay);
$('helpBtn').addEventListener('click', openHelp);
$('homeBtn').addEventListener('click', goTitle);
$('againBtn').addEventListener('click', () => selectLevel(S.levelIndex));
$('backBtn').addEventListener('click', goTitle);

// ================= 操作 =================
function webDown(e) {
  e.preventDefault();
  if (screen !== 'play' || paused) return;
  if (phase === 'intro') { if (phaseT > 0.4) setPhase('play'); return; } // タップで あいさつを とばせる
  webPointers.add(e.pointerId);
}
canvas.addEventListener('pointerdown', webDown);
$('webBtn').addEventListener('pointerdown', webDown);
function steerDown(dir, el) { return e => { e.preventDefault(); if (screen === 'play' && !paused) { steerPointers.set(e.pointerId, dir); el.classList.add('on'); } }; }
$('steerL').addEventListener('pointerdown', steerDown(-1, $('steerL')));
$('steerR').addEventListener('pointerdown', steerDown(1, $('steerR')));
function pointerEnd(e) {
  webPointers.delete(e.pointerId);
  if (steerPointers.has(e.pointerId)) {
    steerPointers.delete(e.pointerId);
    let l = false, r = false; for (const d of steerPointers.values()) { if (d < 0) l = true; else r = true; }
    $('steerL').classList.toggle('on', l); $('steerR').classList.toggle('on', r);
  }
}
window.addEventListener('pointerup', pointerEnd);
window.addEventListener('pointercancel', pointerEnd);
window.addEventListener('blur', releaseAllInput);
window.addEventListener('keydown', e => { if ([' ', 'ArrowLeft', 'ArrowRight'].includes(e.key)) { keys[e.key] = true; e.preventDefault(); } });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ================= ループ =================
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  fx.width = w; fx.height = h;
}
window.addEventListener('resize', resize); resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  // 120Hzでも30fpsでも同じ速さになるよう、経過時間で動かす（1/30秒でクランプ）
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  G.frames++;
  if (running && !paused) advance(dt);
  updateVisuals(dt);
  renderer.render(scene, camera);
}

// ================= テスト用フック =================
// 注意：キャラ・星・ボールは S（コア状態：S.p, S.v, S.stars[].got など）で動いており、
// メッシュの .position は表示のための写しです。テストでは getState() か S を見てください。
window.__game = {
  get S() { return S; }, camera, scene, G,
  get frames() { return G.frames; }, get elapsed() { return G.elapsed; },
  get state() { return screen; },
  CFG, VIEW,
  api: {
    startLevel(i, opt) { selectLevel(i); startPlay(); if (opt && opt.skipIntro) setPhase('play'); },
    skipIntro() { if (phase === 'intro') setPhase('play'); },
    // 固定ステップで n 回進める（表示の補間もステップごとに進める）。noRender=true なら描画しない
    tick(n, dt, noRender) { dt = dt || 1 / 60; for (let i = 0; i < (n || 1); i++) { advance(dt); updateVisuals(dt); } if (!noRender) renderer.render(scene, camera); },
    press() { apiInput.held = true; }, release() { apiInput.held = false; },
    steer(v) { apiInput.steer = v || 0; },
    pause(on) { paused = !!on; },
    getState() {
      return {
        screen, phase, running, paused, level: S ? S.levelIndex + 1 : 0, mode: S && S.mode, world: S && S.world,
        p: S && { ...S.p }, v: S && { ...S.v }, heading: S && S.heading, rope: !!(S && S.rope), spent: !!(S && S.spent),
        hasTarget: !!target, starsGot: S ? S.starsGot : 0, stars: S ? S.stars.length : 0,
        t: G.elapsed, simT: S ? S.t : 0, goalZ: S ? S.goalZ : 0, finished: !!(S && S.finished), frames: G.frames
      };
    }
  }
};

buildWorld(0);
$('hud').style.display = 'none'; $('pad').style.display = 'none';
requestAnimationFrame(frame);

</script>
</body>
</html>
